<fieldset class="row g-2 border-0 p-0 m-0" [disabled]="disabled()">
  <legend class="visually-hidden">Menu sorting</legend>
  <div class="col">
    <label class="form-label" for="menu-sort">Sort by</label
    ><select
      id="menu-sort"
      class="form-select"
      [ngModel]="query().sortBy || ''"
      (ngModelChange)="sort($event, query().sortDirection || 'asc')"
    >
      <option value="">Default order</option>
      @for (field of fields; track field) {
        <option [value]="field">{{ human(field) }}</option>
      }
    </select>
  </div>
  <div class="col">
    <label class="form-label" for="menu-direction">Direction</label
    ><select
      id="menu-direction"
      class="form-select"
      [ngModel]="query().sortDirection || 'asc'"
      (ngModelChange)="sort(query().sortBy || '', $event)"
    >
      <option value="asc">Ascending</option>
      <option value="desc">Descending</option>
    </select>
  </div>
</fieldset>
