<section
  class="rate-limit"
  aria-labelledby="rate-limit-title"
  aria-describedby="rate-limit-message"
>
  <button
    type="button"
    class="rate-limit__close"
    aria-label="Close dialog"
    (click)="modal.dismiss()"
  >
    <span aria-hidden="true">&times;</span>
  </button>
  <div class="rate-limit__icon" aria-hidden="true">
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="12" stroke="currentColor" stroke-width="1.5" />
      <path
        d="M16 9v7l4 3"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>
  <p class="rate-limit__eyebrow">AURUM WORKSPACE</p>
  <h2 id="rate-limit-title">A moment, please</h2>
  <p id="rate-limit-message" class="rate-limit__message">
    You’ve made too many requests in a short time. Please wait before trying your action again.
  </p>
  <div class="rate-limit__countdown" role="timer" aria-label="Seconds until you can try again">
    <span class="rate-limit__seconds">{{ secondsLeft }}</span>
    <span>seconds remaining</span>
  </div>
  <p class="rate-limit__status" role="status">
    {{
      secondsLeft > 0
        ? 'Please wait while the request limit resets.'
        : 'You can try your action again now.'
    }}
  </p>
  <button
    type="button"
    class="rate-limit__button"
    [disabled]="secondsLeft > 0"
    (click)="modal.close()"
  >
    {{ secondsLeft > 0 ? 'Please wait…' : 'Continue' }}
  </button>
</section>
