<header class="home-header" [class.home-header--scroll]="isScrolled()">
  <div class="home-header__inner">
    <a href="#top" class="home-header__logo" aria-label="AURUMI home">AURUM</a>
    <nav aria-label="Primary navigation">
      <a
        href="#services"
        [class.active]="activeSection() === 'services'"
        [attr.aria-current]="activeSection() === 'services' ? 'page' : null"
      >
        Services
      </a>

      <a href="#about" [class.active]="activeSection() === 'about'">About Us</a>
      <a href="#events" [class.active]="activeSection() === 'events'">Events</a>
      <a href="#process" [class.active]="activeSection() === 'process'">Process</a>
      <a href="#team" [class.active]="activeSection() === 'team'">Team</a>
      <a href="#contact" [class.active]="activeSection() === 'contact'">Contact</a>
    </nav>
    <a class="home-header__consultation" href="#contact">Consultation</a>
  </div>
</header>
